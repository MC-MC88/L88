<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MC88 ANIMATIONS LIBRARY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0b0c0e;
--bg2:#111317;
--panel:#14171c;
--ink:#f1f3f5;
--muted:#8e969f;
--line:#272c33;
--line2:#343b44;
--accent:#d8ff62;
--ease:cubic-bezier(.22,1,.36,1);
--bloom:cubic-bezier(.34,1.56,.64,1);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;line-height:1.6;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 15% -10%,rgba(216,255,98,.08),transparent 28%),radial-gradient(circle at 90% 20%,rgba(255,255,255,.035),transparent 30%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:screen}
header{position:sticky;top:0;z-index:100;height:68px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:rgba(11,12,14,.82);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.18em}
.brandMark{width:28px;height:28px;border:1px solid var(--line2);display:grid;place-items:center;border-radius:8px;color:var(--accent);font-size:10px}
.brand span{color:var(--muted);font-weight:400}
.searchWrap{display:flex;align-items:center;gap:10px;position:relative}
.searchWrap svg{position:absolute;left:13px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
#search{width:240px;height:38px;padding:0 13px 0 38px;border:1px solid var(--line2);border-radius:10px;outline:none;background:var(--panel);color:var(--ink);font:500 12px ui-monospace,monospace;transition:.3s var(--ease)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(216,255,98,.08)}
#search::-webkit-outer-spin-button,#search::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#search{appearance:textfield;-moz-appearance:textfield}
.toolbar{max-width:1320px;margin:0 auto;padding:26px 28px 12px;display:flex;justify-content:space-between;color:var(--muted);font:10px ui-monospace,monospace;letter-spacing:.12em}
.toolbar .count{color:var(--ink)}
.grid{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 28px 84px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{min-width:0;background:linear-gradient(145deg,#181c22,#14171c);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .45s var(--ease),border-color .45s var(--ease),box-shadow .45s var(--ease)}
.card:hover{transform:translateY(-5px);border-color:var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.card.hidden{display:none}
.stage{height:230px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at center,rgba(255,255,255,.025),transparent 58%),#0e1013;border-bottom:1px solid var(--line)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent 35%,transparent 65%,rgba(216,255,98,.025))}
.stage>*{position:relative;z-index:2}
.stage [class*="pv-"]{color:var(--ink)}
.stage svg{overflow:visible}
.num{position:absolute!important;z-index:5!important;top:12px;left:12px;padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:rgba(11,12,14,.65);color:#aab1b9;font:10px ui-monospace,monospace;letter-spacing:.12em}
.sig{position:absolute!important;z-index:5!important;right:12px;bottom:12px;color:rgba(216,255,98,.5);font:8px ui-monospace,monospace;letter-spacing:.14em;pointer-events:none;white-space:nowrap}
.live{position:absolute!important;z-index:5!important;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;color:#68717a;font:8px ui-monospace,monospace;letter-spacing:.12em}
.live i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(216,255,98,.65);animation:liveDot 1.2s ease-in-out infinite}
@keyframes liveDot{50%{opacity:.3;transform:scale(.65)}}
.copy{border:none;background:transparent;width:100%;padding:13px 14px;font:10.5px ui-monospace,monospace;letter-spacing:.16em;color:#d7dce1;cursor:pointer;border-top:1px solid var(--line);text-transform:uppercase;transition:.3s var(--ease)}
.copy:hover{background:var(--accent);color:#0b0c0e}
.copy.copied{background:var(--accent);color:#0b0c0e}
.empty{grid-column:1/-1;min-height:240px;border:1px dashed var(--line2);border-radius:14px;display:grid;place-items:center;color:var(--muted);font:11px ui-monospace,monospace;letter-spacing:.12em}
footer{border-top:1px solid var(--line);padding:28px;color:#69717a;text-align:center;font:10px ui-monospace,monospace;letter-spacing:.1em}

/* ============ PREVIEWS ============ */
.pv-grain{position:relative;width:150px;height:150px;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.pv-grain::before{content:"";position:absolute;inset:-50%;width:200%;height:200%;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");opacity:.35;mix-blend-mode:multiply;animation:grainShift 3s steps(6) infinite}
@keyframes grainShift{0%,100%{transform:translate(0,0)}25%{transform:translate(-5%,3%)}50%{transform:translate(-4%,2%)}75%{transform:translate(3%,-3%)}}

.pv-drift{position:relative;width:160px;height:150px;overflow:hidden}
.pv-drift .p{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--muted);animation:driftP 4s linear infinite}
@keyframes driftP{0%{transform:translate(0,20px) scale(.6);opacity:0}15%{opacity:.6}85%{opacity:.6}100%{transform:translate(var(--dx,20px),-130px) scale(1);opacity:0}}

.pv-shimmer{width:170px;height:40px;background:linear-gradient(90deg,var(--panel) 0%,var(--bg) 50%,var(--panel) 100%);background-size:200% 100%;border:1px solid var(--line);border-radius:3px;animation:shimmer 2.4s linear infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.pv-scan{position:relative;width:150px;height:90px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;font:10px ui-monospace,monospace;letter-spacing:.16em;color:var(--muted);overflow:hidden}
.pv-scan::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--ink);animation:scanLn 2s linear infinite}
@keyframes scanLn{0%{transform:translateY(0);opacity:.2}50%{opacity:1}100%{transform:translateY(90px);opacity:.2}}

.pv-night{position:relative;width:150px;height:150px;background:#0a0b0d;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.pv-night .s{position:absolute;width:2px;height:2px;border-radius:50%;background:#f5f1e8;animation:nightTw 3s ease-in-out infinite}
@keyframes nightTw{0%,100%{opacity:.2}50%{opacity:1}}

.pv-rise{font:700 1.4rem Georgia,serif;color:var(--ink);animation:riseIn 2.4s var(--ease) infinite}
@keyframes riseIn{0%{opacity:0;transform:translateY(22px)}40%,70%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}

.pv-word{font:700 1.4rem Georgia,serif;color:var(--ink);display:flex;gap:8px}
.pv-word span{display:inline-block;opacity:0;animation:wordIn 2.8s var(--ease) infinite}
.pv-word span:nth-child(2){animation-delay:.18s}
.pv-word span:nth-child(3){animation-delay:.36s}
.pv-word span:nth-child(4){animation-delay:.54s}
@keyframes wordIn{0%{opacity:0;transform:translateY(28px) rotate(1.5deg)}25%,65%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(-6px) rotate(0)}}

.pv-line{width:130px;height:1px;background:var(--accent);transform-origin:right;animation:lineDrawCycle 2.4s var(--ease) infinite}
@keyframes lineDrawCycle{0%{transform:scaleX(0);opacity:.2}45%,70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:.2}}

.pv-typing{font:13px ui-monospace,monospace;color:var(--ink);direction:ltr;overflow:hidden;white-space:nowrap;border-left:2px solid var(--accent);padding-left:6px;animation:typing 4s steps(20) infinite,caretB .8s steps(2) infinite}
@keyframes typing{0%{width:0}50%,85%{width:180px}100%{width:0}}
@keyframes caretB{0%,49%{border-color:var(--accent)}50%,100%{border-color:transparent}}

.pv-split{font:700 1.6rem Georgia,serif;color:var(--ink);display:flex;gap:6px}
.pv-split span{display:inline-block;animation:splitIn 3s var(--bloom) infinite}
.pv-split span:nth-child(2){animation-delay:.15s}
.pv-split span:nth-child(3){animation-delay:.3s}
@keyframes splitIn{0%{opacity:0;transform:translateY(-30px) rotate(-8deg)}30%,70%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(20px) rotate(6deg)}}

.pv-mask{position:relative;display:inline-block;font:700 1.6rem Georgia,serif;color:var(--ink)}
.pv-mask::after{content:"";position:absolute;inset:0;background:var(--bg);transform-origin:right;animation:maskReveal 3s var(--ease) infinite}
@keyframes maskReveal{0%{transform:scaleX(1);opacity:1}45%,75%{transform:scaleX(0);opacity:1}90%,100%{transform:scaleX(0);opacity:0}}

.pv-glitch{font:18px ui-monospace,monospace;color:var(--ink);direction:ltr;letter-spacing:.08em;animation:glitch 2.4s steps(2) infinite}
@keyframes glitch{0%,100%{transform:translate(0);text-shadow:none}10%{transform:translate(-1px,1px);text-shadow:1px 0 #d8ff62}20%{transform:translate(1px,-1px);text-shadow:-1px 0 #8e969f}30%{transform:translate(-2px,0);text-shadow:2px 0 #d8ff62}50%{transform:translate(0,0);text-shadow:none}}

.pv-quote{font:5rem/0.6 Georgia,serif;color:var(--ink);animation:quoteBr 3.5s ease-in-out infinite}
@keyframes quoteBr{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}

.pv-cursor{font:15px ui-monospace,monospace;color:var(--ink);direction:ltr}
.pv-cursor::after{content:"|";display:inline-block;margin-left:2px;animation:cursorB 1s steps(2) infinite}
@keyframes cursorB{0%,49%{opacity:1}50%,100%{opacity:0}}

.pv-ripple{position:relative;display:inline-block;padding:14px 30px;border:1px solid var(--accent);color:var(--accent);font:11px ui-monospace,monospace;letter-spacing:.16em;border-radius:2px;overflow:hidden;background:transparent;cursor:default}
.pv-ripple .r{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--accent);opacity:.25;transform:scale(0);animation:rippleOut 1.8s var(--ease) infinite;pointer-events:none}
@keyframes rippleOut{0%{transform:scale(0);opacity:.35}100%{transform:scale(8);opacity:0}}

.pv-pulseRing{position:relative;width:60px;height:60px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;font:11px ui-monospace,monospace;color:var(--accent)}
.pv-pulseRing::before{content:"";position:absolute;inset:0;border:1px solid var(--accent);border-radius:50%;animation:pulseRing 3.4s ease-out infinite}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.7}70%{transform:scale(1.6);opacity:0}100%{transform:scale(1.6);opacity:0}}

.pv-nodeRing{position:relative;width:44px;height:44px;border:1px solid var(--accent);border-radius:50%;background:var(--panel);display:grid;place-items:center;font:10px ui-monospace,monospace;color:var(--accent)}
.pv-nodeRing::before{content:"";position:absolute;inset:-7px;border:1px solid var(--accent);border-radius:50%;animation:nodeRing 3.8s ease-out infinite}
@keyframes nodeRing{0%{transform:scale(.7);opacity:.75}75%,100%{transform:scale(1.5);opacity:0}}

.pv-road{width:170px;height:36px}
.pv-road svg{width:100%;height:100%}
.pv-road .base{fill:none;stroke:var(--line2);stroke-width:1.2}
.pv-road .flow{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:8 16;animation:roadFlow 5s linear infinite}
@keyframes roadFlow{to{stroke-dashoffset:-96}}

.pv-shake{width:180px;height:7px;background:var(--accent);border-radius:4px;opacity:.7;animation:shakeA 1.6s var(--ease) infinite}
@keyframes shakeA{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.pv-bell svg{width:130px;height:140px;color:var(--ink)}
.pv-bell .ring{fill:none;stroke:currentColor;stroke-width:.9;opacity:0;transform-box:fill-box;transform-origin:center;animation:bellRing 4.5s ease-out infinite}
.pv-bell .ring.r2{animation-delay:.5s}
.pv-bell .ring.r3{animation-delay:1s}
@keyframes bellRing{0%{transform:scale(.4);opacity:.55}70%{transform:scale(1.65);opacity:0}100%{transform:scale(1.65);opacity:0}}
.pv-bell .shape{fill:currentColor;transform-origin:65px 20px;animation:bellSway 4.5s ease-in-out infinite}
@keyframes bellSway{0%,100%{transform:rotate(0)}10%{transform:rotate(-5deg)}20%{transform:rotate(5deg)}30%{transform:rotate(-4deg)}40%{transform:rotate(3deg)}50%{transform:rotate(0)}}
.pv-bell .clap{fill:currentColor;transform-box:fill-box;transform-origin:50% 0%;animation:clapperSway 4.5s ease-in-out infinite}
@keyframes clapperSway{0%,100%{transform:rotate(0)}12%{transform:rotate(10deg)}22%{transform:rotate(-10deg)}32%{transform:rotate(8deg)}42%{transform:rotate(-6deg)}52%{transform:rotate(0)}}

.pv-chain{width:170px;height:60px}
.pv-chain svg{width:100%;height:100%;color:var(--ink)}
.pv-chain .ln{stroke:currentColor;stroke-width:1.4;stroke-dasharray:4 4;fill:none;opacity:.5}
.pv-chain .dot{fill:currentColor;transform-box:fill-box;transform-origin:center;animation:chainPulse 3s ease-in-out infinite}
.pv-chain .dot.d2{animation-delay:.35s}
.pv-chain .dot.d3{animation-delay:.7s}
.pv-chain .dot.d4{animation-delay:1.05s}
@keyframes chainPulse{0%,100%{opacity:.3;transform:scale(.7)}20%{opacity:1;transform:scale(1.15)}40%{opacity:.9;transform:scale(1)}}

.pv-check{width:150px;height:120px}
.pv-check svg{width:100%;height:100%;color:var(--ink)}
.pv-check .bx{fill:none;stroke:currentColor;stroke-width:1.4}
.pv-check .li{stroke:currentColor;stroke-width:1.4;stroke-linecap:round;opacity:.35}
.pv-check .ck{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14}
.pv-check .ck.c1{animation:checkDraw 3.6s ease-in-out infinite;animation-delay:0s}
.pv-check .ck.c2{animation:checkDraw 3.6s ease-in-out infinite;animation-delay:1.2s}
.pv-check .ck.c3{animation:checkDraw 3.6s ease-in-out infinite;animation-delay:2.4s}
@keyframes checkDraw{0%,10%{stroke-dashoffset:14;opacity:0}30%{stroke-dashoffset:0;opacity:1}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:14;opacity:0}}

.pv-arcs{width:150px;height:150px}
.pv-arcs svg{width:100%;height:100%;color:var(--ink)}
.pv-arcs .a{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200}
.pv-arcs .a.a1{animation:arcDraw 5s ease-in-out infinite}
.pv-arcs .a.a2{animation:arcDraw 5s ease-in-out infinite;animation-delay:2.5s}
@keyframes arcDraw{0%{stroke-dashoffset:200;opacity:.15}40%{stroke-dashoffset:0;opacity:1}75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-200;opacity:.15}}
.pv-arcs .head{fill:currentColor;opacity:0;animation:headFade 5s ease-in-out infinite}
.pv-arcs .head.h2{animation-delay:2.5s}
@keyframes headFade{0%,30%{opacity:0}45%,70%{opacity:1}85%,100%{opacity:0}}

.pv-perf{width:140px;height:140px}
.pv-perf svg{width:100%;height:100%;color:var(--ink)}
.pv-perf .bgc{fill:none;stroke:currentColor;stroke-width:1;opacity:.15}
.pv-perf .arc{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg);stroke-dasharray:216 220;animation:perfBreathe 3.4s ease-in-out infinite}
@keyframes perfBreathe{0%,100%{opacity:.85;stroke-width:2.4}50%{opacity:1;stroke-width:2.8}}
.pv-perf .pct{fill:currentColor;font:600 12px ui-monospace,monospace;text-anchor:middle;dominant-baseline:middle}

.pv-pulse{width:240px;height:60px}
.pv-pulse svg{width:100%;height:100%;color:var(--ink)}
.pv-pulse .ln{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;animation:pulseDraw 3.2s linear infinite}
@keyframes pulseDraw{0%{stroke-dashoffset:400}100%{stroke-dashoffset:-400}}
.pv-pulse .dot{fill:var(--accent);animation:pulseDot 3.2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:.3;r:2}50%{opacity:1;r:3.5}}

.pv-heart{padding:14px 34px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:600 1.1rem Georgia,serif;border-radius:2px;animation:heartbeat 4.2s ease-in-out infinite}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.035)}24%{transform:scale(1)}36%{transform:scale(1.02)}48%{transform:scale(1)}}

.pv-breathe{position:relative;width:80px;height:80px}
.pv-breathe::before,.pv-breathe::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(216,255,98,.35) 0%,transparent 72%);animation:breathe 6s ease-in-out infinite}
.pv-breathe::after{inset:12px;background:radial-gradient(circle,rgba(216,255,98,.5) 0%,transparent 72%);animation-delay:.4s}
@keyframes breathe{0%,100%{transform:scale(.82);opacity:.5}50%{transform:scale(1.18);opacity:1}}

.pv-loader{width:200px}
.pv-loader .bar{height:4px;background:var(--line2);border-radius:4px;overflow:hidden}
.pv-loader .fill{height:100%;background:var(--accent);width:0%;border-radius:4px;animation:loaderFill 4s var(--ease) infinite}
@keyframes loaderFill{0%{width:0%}40%{width:99%}90%,100%{width:99%}}
.pv-loader .meta{display:flex;justify-content:space-between;margin-top:10px;font:10px ui-monospace,monospace;color:var(--muted);letter-spacing:.1em}

.pv-bars{display:flex;gap:5px;align-items:flex-end;height:80px}
.pv-bars span{width:7px;background:var(--accent);border-radius:2px;transform-origin:bottom;animation:barGrow 3.6s ease-in-out infinite}
.pv-bars span:nth-child(1){height:30%;animation-delay:0s}
.pv-bars span:nth-child(2){height:70%;animation-delay:.2s}
.pv-bars span:nth-child(3){height:50%;animation-delay:.4s}
.pv-bars span:nth-child(4){height:90%;animation-delay:.6s}
.pv-bars span:nth-child(5){height:40%;animation-delay:.8s}
.pv-bars span:nth-child(6){height:75%;animation-delay:1s}
@keyframes barGrow{0%,10%{transform:scaleY(.1);opacity:.3}30%,55%{transform:scaleY(1);opacity:1}70%{transform:scaleY(1);opacity:.4}85%,100%{transform:scaleY(.1);opacity:0}}

.pv-streak{width:230px;height:110px}
.pv-streak svg{width:100%;height:100%;color:var(--accent)}
.pv-streak .day{transform-box:fill-box;transform-origin:center bottom;animation:dayFill 4.2s ease-in-out infinite}
.pv-streak .day.d2{animation-delay:.2s}
.pv-streak .day.d3{animation-delay:.4s}
.pv-streak .day.d4{animation-delay:.6s}
.pv-streak .day.d5{animation-delay:.8s}
.pv-streak .day.d6{animation-delay:1s}
.pv-streak .day.d7{animation-delay:1.2s}
.pv-streak .day.d8{animation-delay:1.4s}
@keyframes dayFill{0%,5%{transform:scaleY(.15);opacity:.2}25%,75%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:.85}}

.pv-path{width:150px;height:150px}
.pv-path svg{width:100%;height:100%;color:var(--ink)}
.pv-path .path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:220;stroke-dashoffset:220;animation:pathDraw 4s ease-in-out infinite}
@keyframes pathDraw{0%{stroke-dashoffset:220;opacity:.3}50%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.3}}
.pv-path .dot{fill:var(--accent);opacity:.3;animation:pathDot 4s ease-in-out infinite}
@keyframes pathDot{0%,100%{opacity:.3}50%,80%{opacity:1}}

.pv-plant{width:140px;height:170px}
.pv-plant svg{width:100%;height:100%;color:var(--ink)}
.pv-plant path,.pv-plant line{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pv-plant .soil{stroke-dasharray:3 6}
.pv-plant .stem{stroke-dasharray:200;stroke-dashoffset:200;animation:stemGrow 5s ease-in-out infinite}
@keyframes stemGrow{0%,10%{stroke-dashoffset:200}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.pv-plant .leaf{fill:var(--accent);fill-opacity:0;stroke-dasharray:60;stroke-dashoffset:60}
.pv-plant .leaf.l1{animation:leafGrow 5s ease-in-out infinite;animation-delay:.6s}

const grid=document.getElementById('grid');
const search=document.getElementById('search');
const count=document.getElementById('count');

document.querySelectorAll('.pv-drift').forEach(function(){
  // will be populated when card is created
});

function copy(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();return Promise.resolve()}

function buildCard(a){
  const card=document.createElement('div');
  card.className='card';
  card.dataset.id=a.id;
  card.innerHTML=`<div class="stage"><span class="num">${String(a.id).padStart(3,'0')}</span>${a.preview}<span class="live"><i></i>LIVE</span><span class="sig">ANIMATION SIGNATURE MC88</span></div><button class="copy" type="button">COPY CODE</button>`;
  card.querySelector('.copy').addEventListener('click',function(){
    const btn=this;
    copy(a.css+'\n\n'+a.usage).then(function(){
      btn.textContent='COPIED';btn.classList.add('copied');
      setTimeout(function(){btn.textContent='COPY CODE';btn.classList.remove('copied')},1400);
    });
  });
  return card;
}

const frag=document.createDocumentFragment();
A.forEach(function(a){frag.appendChild(buildCard(a))});
grid.appendChild(frag);

document.querySelectorAll('.pv-drift').forEach(function(box){
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='p';
    p.style.right=Math.random()*100+'%';
    p.style.bottom='-10px';
    p.style.animationDelay=(-Math.random()*4)+'s';
    p.style.setProperty('--dx',((Math.random()-.5)*100)+'px');
    box.appendChild(p);
  }
});

document.querySelectorAll('.pv-night').forEach(function(box){
  for(let i=0;i<24;i++){
    const s=document.createElement('div');
    s.className='s';
    s.style.top=Math.random()*100+'%';
    s.style.left=Math.random()*100+'%';
    s.style.animationDelay=(-Math.random()*3)+'s';
    box.appendChild(s);
  }
});

function filter(){
  const q=search.value.trim();
  let v=0;
  document.querySelectorAll('.card').forEach(function(c){
    const show=!q||Number(c.dataset.id)===Number(q);
    c.classList.toggle('hidden',!show);
    if(show)v++;
  });
  count.textContent=q?(v?v+' ANIMATION':'0 RESULTS'):'113 ANIMATIONS';
  if(q){
    const t=document.querySelector('.card[data-id="'+Number(q)+'"]');
    if(t)t.scrollIntoView({behavior:'smooth',block:'center'});
  }
}
search.addEventListener('input',filter);
})();
